
<!DOCTYPE html>

<html>

<head>

    <title>JWT Authentication System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        .header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin: 5px;
            font-size: 15px;
        }

        .signup-btn {
            background: #198754;
        }

        .login-btn {
            background: #0d6efd;
        }

        .profile-btn {
            background: #6f42c1;
        }

        .users-btn {
            background: #fd7e14;
        }

        .logout-btn {
            background: #dc3545;
        }

        #result {
            background: #111;
            color: #00ff88;
            padding: 20px;
            border-radius: 8px;
            min-height: 120px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: monospace;
        }

        .token-box {
            margin-top: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            word-break: break-all;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>JWT Authentication System</h1>

    <p>FastAPI + SQLite + SQLAlchemy ORM + JWT</p>

</div>


<div class="container">


    <!-- SIGNUP -->

    <div class="card">

        <h2>1. User Signup</h2>

        <input
            type="text"
            id="signupUsername"
            placeholder="Enter Username"
        >

        <input
            type="text"
            id="signupFullName"
            placeholder="Enter Full Name"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Enter Password"
        >

        <button
            class="signup-btn"
            onclick="signup()"
        >
            Signup
        </button>

    </div>


    <!-- LOGIN -->

    <div class="card">

        <h2>2. User Login</h2>

        <input
            type="text"
            id="loginUsername"
            placeholder="Enter Username"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter Password"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>


        <div class="token-box">

            <strong>JWT Token:</strong>

            <div id="token">
                Not logged in
            </div>

        </div>

    </div>


    <!-- PROTECTED APIs -->

    <div class="card">

        <h2>3. Protected APIs</h2>

        <button
            class="profile-btn"
            onclick="getProfile()"
        >
            Get Profile
        </button>


        <button
            class="users-btn"
            onclick="getUsers()"
        >
            Get All Users
        </button>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <!-- RESULT -->

    <div class="card">

        <h2>API Result</h2>

        <div id="result">
            Waiting for action...
        </div>

    </div>


</div>


<script>


let token = "";


// =================================================
// SHOW RESULT
// =================================================

function showResult(data) {

    document.getElementById("result").innerText =
        JSON.stringify(data, null, 2);

}


// =================================================
// SIGNUP
// =================================================

async function signup() {

    const username =
        document.getElementById(
            "signupUsername"
        ).value;


    const full_name =
        document.getElementById(
            "signupFullName"
        ).value;


    const password =
        document.getElementById(
            "signupPassword"
        ).value;


    if (!username || !full_name || !password) {

        showResult({

            error: "Please fill all signup fields"

        });

        return;
    }


    const response = await fetch(

        "/signup",

        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({

                username: username,

                password: password,

                full_name: full_name

            })

        }

    );


    const data =
        await response.json();


    showResult(data);

}


// =================================================
// LOGIN
// =================================================

async function login() {

    const username =
        document.getElementById(
            "loginUsername"
        ).value;


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    if (!username || !password) {

        showResult({

            error:
                "Please enter username and password"

        });

        return;
    }


    const response = await fetch(

        "/login",

        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({

                username: username,

                password: password

            })

        }

    );


    const data =
        await response.json();


    if (response.ok) {

        token = data.access_token;


        document.getElementById(
            "token"
        ).innerText = token;


        showResult(data);

    }

    else {

        showResult(data);

    }

}


// =================================================
// GET PROFILE
// =================================================

async function getProfile() {

    if (!token) {

        showResult({

            error:
                "Please login first"

        });

        return;
    }


    const response = await fetch(

        "/profile",

        {

            method: "GET",

            headers: {

                "Authorization":
                    "Bearer " + token

            }

        }

    );


    const data =
        await response.json();


    showResult(data);

}


// =================================================
// GET ALL USERS
// =================================================

async function getUsers() {

    if (!token) {

        showResult({

            error:
                "Please login first"

        });

        return;
    }


    const response = await fetch(

        "/users",

        {

            method: "GET",

            headers: {

                "Authorization":
                    "Bearer " + token

            }

        }

    );


    const data =
        await response.json();


    showResult(data);

}


// =================================================
// LOGOUT
// =================================================

async function logout() {

    if (!token) {

        showResult({

            message:
                "You are already logged out"

        });

        return;
    }


    const response = await fetch(

        "/logout",

        {

            method: "POST",

            headers: {

                "Authorization":
                    "Bearer " + token

            }

        }

    );


    const data =
        await response.json();


    token = "";


    document.getElementById(
        "token"
    ).innerText =
        "Not logged in";


    showResult(data);

}

</script>


</body>

</html>
